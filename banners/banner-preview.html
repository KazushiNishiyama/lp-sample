<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>広告バナープレビュー</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #f4efe6;
        color: #151922;
        font-family: "Yu Gothic", "YuGothic", "Meiryo", system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 28px;
      }
      .stack {
        display: grid;
        gap: 28px;
      }
      figure {
        margin: 0;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
        box-shadow: 0 18px 48px rgba(21, 25, 34, 0.16);
      }
      figcaption {
        margin-top: 10px;
        color: #657080;
        font-size: 14px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>AIクリエイティブ体験会 広告バナー</h1>
    <div class="stack">
      <figure>
        <img src="./banner-ai-experience-1200x628.svg" alt="横長バナー" />
        <figcaption>1200 x 628</figcaption>
      </figure>
      <figure>
        <img src="./banner-ai-experience-1080x1080.svg" alt="正方形バナー" />
        <figcaption>1080 x 1080</figcaption>
      </figure>
      <figure>
        <img src="./banner-ai-experience-728x90.svg" alt="リーダーボードバナー" />
        <figcaption>728 x 90</figcaption>
      </figure>
    </div>
  </body>
</html>
